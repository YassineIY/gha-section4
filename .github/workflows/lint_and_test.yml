name: LTD on push
on: push
jobs:
  lint-test: 
    runs-on: ubuntu-latest
    steps:
      - name: get the code
        uses: actions/checkout@v3

      - name: install nodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: installing dependencies
        run: npm ci

      - name: lint the code
        run: npm run lint

      - name: Run tests
        run: npm test

  deploy:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v3
  
      - name: install nodeJS
        uses: actions/setup-node@v3
        with:
          node-version: 18
  
      - name: Install dependencies"
        run: npm ci
  
      - name: Build project
        run: npm run build
  
      - name: Deploy
        run: echo "deploying..."