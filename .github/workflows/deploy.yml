name: deploy
on:
    workflow_run:
        workflows: ['lint_and_test']
        types: [completed]
        branches:
            - 'beta'

jobs:
    deploy:
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        steps:
            - name: Get code
              uses: actions/checkout@v3

            - name: install nodeJS
              uses: actions/setup-node@v3
              with:
                node-version: 18

            - name: Install dependencies"
              run: npm ci

            - name: Build project
              run: npm run build

            - name: Deploy
              run: echo "deploying..."